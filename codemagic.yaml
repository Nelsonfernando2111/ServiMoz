workflows:
  ios-simulator:
    name: ServiMoz Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Gerar projeto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Compilar para o simulador
        script: |
          xcodebuild \
            -project ServiMoz.xcodeproj \
            -scheme ServiMoz \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Criar o zip da app
        script: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$CM_BUILD_DIR/ServiMoz.zip" ServiMoz.app
    artifacts:
      - ServiMoz.zip
